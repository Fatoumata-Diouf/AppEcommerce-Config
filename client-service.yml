
server:
  port: 8081

spring:
  application:
    name: client-service

  datasource:
    url: jdbc:postgresql://postgres:5432/clientdb
    username: admin
    password: passer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true


# Proprietes metier RAFRAICHISSABLES a chaud
library:
  max-loan-days: 22
  late-fee-per-day: 50
  welcome-message: "Bienvenue dans la page de registre des clients"
