server:
  port: 8082

spring:
  application:
    name: commande-service

  datasource:
    url: jdbc:postgresql://postgres:5432/commandedb
    username: admin
    password: passer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

# Proprietes metier RAFRAICHISSABLES a chaud
library:
  max-loan-days: 14
  late-fee-per-day: 50
  welcome-message: "Bienvenue dans la page de registre des commandes de produits"

resilience4j:
  circuitbreaker:
    instances:
      produitService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - feign.FeignException$NotFound
      clientService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - feign.FeignException$NotFound
  retry:
    instances:
      produitService:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - feign.FeignException$NotFound
      clientService:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - feign.FeignException$NotFound

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
