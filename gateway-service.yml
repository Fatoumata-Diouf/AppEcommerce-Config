
server:
  port: 8080

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8180/realms/isi-tp/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/clients/**

        - id: produit-service
          uri: lb://produit-service
          predicates:
            - Path=/produits/**

        - id: commande-service
          uri: lb://commande-service
          predicates:
            - Path=/commandes/**

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

# Proprietes metier RAFRAICHISSABLES a chaud
library:
  max-loan-days: 14
  late-fee-per-day: 50
  welcome-message: "Bienvenue dans la page de passerelle"
